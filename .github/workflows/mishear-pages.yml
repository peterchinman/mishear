# Builds the mishear web demo (web/) and publishes it to GitHub Pages.
# The build generates the word-frequency list and verifies the packed
# word-pair model downloaded from the pinned GitHub release.
name: mishear demo

on:
  push:
    branches: [main]
    paths:
      - web/**
      - scripts/**
      - examples/**
      - src/**
      - data/CMUdict/**
      - data/VarCon/**
      - data/gatsby/**
      - data/proverbs/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/mishear-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mishear-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Word frequencies (wordfreq, CC BY-SA 4.0)
        run: |
          python -m pip install wordfreq==3.1.1
          python -I scripts/wordfreq_list.py 100000

      - name: Download and verify the word-pair model
        run: scripts/download_bigrams.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the page
        working-directory: web
        env:
          MISHEAR_BASE: /${{ github.event.repository.name }}/
        run: |
          wasm-pack build .. --target web --out-dir web/pkg -- --locked
          npm ci
          npm run data
          npx tsc --noEmit
          npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
